<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <!-- PWA теги для iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Антистресс Раскраска</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --panel-bg: #18181b;
      --text-color: #ffffff;
      --accent: #3b82f6;
    }
    
    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden; /* Скрываем общий скролл, скроллится будут только контейнеры */
    }

    /* Управление экранами */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }
    .screen.active {
      display: flex;
    }

    /* === ЭКРАН ГАЛЕРЕИ === */
    #gallery-screen {
      padding: 20px;
      overflow-y: auto;
    }
    
    .gallery-header {
      text-align: center;
      margin-bottom: 25px;
      margin-top: env(safe-area-inset-top, 20px); /* Отступ для челки iPhone */
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      padding-bottom: 40px;
    }

    .gallery-item {
      background: var(--panel-bg);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      border: 2px solid #27272a;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-item:active {
      transform: scale(0.95);
    }

    .gallery-item svg {
      width: 100%;
      height: auto;
      pointer-events: none; /* Чтобы клик срабатывал на карточку, а не на SVG */
    }

    /* === ЭКРАН РАСКРАСКИ === */
    .top-bar {
      background-color: var(--panel-bg);
      padding: env(safe-area-inset-top, 15px) 15px 15px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #27272a;
      z-index: 10;
    }

    .btn {
      background: #27272a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    #resetBtn {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    #svgContainer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 20px;
      touch-action: pan-x pan-y pinch-zoom;
    }

    /* Стили для активной раскраски */
    #svgContainer svg {
      max-width: 95%;
      max-height: 95%;
      width: 100%;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.03));
    }

    #svgContainer svg path, 
    #svgContainer svg polygon, 
    #svgContainer svg circle {
      fill: #e4e4e7; /* Базовый цвет */
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill 0.15s ease;
    }

    /* Панель инструментов */
    #toolbar {
      background-color: var(--panel-bg);
      padding: 15px 12px env(safe-area-inset-bottom, 15px) 12px;
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      border-top: 1px solid #27272a;
      z-index: 10;
    }

    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #3f3f46;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .color-btn.active {
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow: 0 0 16px var(--glow-color);
    }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ГАЛЕРЕЯ -->
  <div id="gallery-screen" class="screen active">
    <div class="gallery-header">
      <h2>Моя Галерея</h2>
      <p style="color: #a1a1aa; font-size: 14px;">Выбери рисунок. Прогресс сохраняется автоматически.</p>
    </div>
    <div class="grid" id="galleryGrid">
      <!-- Карточки генерируются через JS -->
    </div>
  </div>

  <!-- ЭКРАН 2: РАСКРАСКА -->
  <div id="coloring-screen" class="screen">
    <div class="top-bar">
      <button class="btn" id="backBtn">❮ Галерея</button>
      <button class="btn" id="resetBtn">Сбросить</button>
    </div>

    <div id="svgContainer">
      <!-- Сюда вставляется выбранный SVG -->
    </div>

    <div id="toolbar">
      <div class="color-btn active" style="background: #ff003c; --glow-color: rgba(255,0,60,0.6);" data-color="#ff003c"></div>
      <div class="color-btn" style="background: #a855f7; --glow-color: rgba(168,85,247,0.6);" data-color="#a855f7"></div>
      <div class="color-btn" style="background: #3b82f6; --glow-color: rgba(59,130,246,0.6);" data-color="#3b82f6"></div>
      <div class="color-btn" style="background: #06b6d4; --glow-color: rgba(6,182,212,0.6);" data-color="#06b6d4"></div>
      <div class="color-btn" style="background: #10b981; --glow-color: rgba(16,185,129,0.6);" data-color="#10b981"></div>
      <div class="color-btn" style="background: #f43f5e; --glow-color: rgba(244,63,94,0.6);" data-color="#f43f5e"></div>
      <div class="color-btn" style="background: #f59e0b; --glow-color: rgba(245,158,11,0.6);" data-color="#f59e0b"></div>
      <div class="color-btn" style="background: #e4e4e7; border: 2px dashed #71717a; --glow-color: rgba(255,255,255,0.4);" data-color="#e4e4e7" title="Ластик"></div>
    </div>
  </div>

  <script>
    // === БАЗА ДАННЫХ КАРТИНОК ===
    const images = [
      {
        id: 'mandala',
        svg: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g>
            <path d="M100,10 C120,40 140,40 150,100 C140,160 120,160 100,190 C80,160 60,160 50,100 C60,40 80,40 100,10" />
            <path d="M35,35 C60,45 80,60 100,100 C80,140 60,155 35,165 C45,140 60,120 100,100 C60,80 45,60 35,35" />
            <path d="M165,35 C140,45 120,60 100,100 C120,140 140,155 165,165 C155,140 140,120 100,100 C140,80 155,60 165,35" />
            <path d="M100,40 L115,85 L160,100 L115,115 L100,160 L85,115 L40,100 L85,85 Z" />
            <circle cx="100" cy="100" r="30" />
            <polygon points="100,75 120,100 100,125 80,100" />
            <circle cx="100" cy="100" r="10" />
          </g>
        </svg>`
      },
      {
        id: 'crystal',
        svg: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g>
            <polygon points="100,20 150,70 100,180 50,70" />
            <polygon points="100,20 100,180 150,70" />
            <polygon points="100,20 100,180 50,70" />
            <polygon points="50,70 150,70 100,90" />
            <polygon points="100,20 130,50 100,90 70,50" />
          </g>
        </svg>`
      },
      {
        id: 'geo-flower',
        svg: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g>
            <circle cx="100" cy="100" r="80" />
            <circle cx="100" cy="60" r="40" />
            <circle cx="100" cy="140" r="40" />
            <circle cx="60" cy="100" r="40" />
            <circle cx="140" cy="100" r="40" />
            <polygon points="100,60 140,100 100,140 60,100" />
            <circle cx="100" cy="100" r="15" />
          </g>
        </svg>`
      }
    ];

    // === ЛОГИКА ПРИЛОЖЕНИЯ ===
    let currentColor = '#ff003c';
    let currentImageId = null;
    let isDragging = false;
    
    // Загрузка сохранений из памяти браузера
    let savedProgress = JSON.parse(localStorage.getItem('incolor_progress')) || {};

    const galleryScreen = document.getElementById('gallery-screen');
    const coloringScreen = document.getElementById('coloring-screen');
    const galleryGrid = document.getElementById('galleryGrid');
    const svgContainer = document.getElementById('svgContainer');

    // 1. Отрисовка галереи
    images.forEach(img => {
      const card = document.createElement('div');
      card.className = 'gallery-item';
      card.innerHTML = img.svg;
      card.addEventListener('click', () => openImage(img.id));
      galleryGrid.appendChild(card);
    });

    // 2. Открытие картинки
    function openImage(id) {
      currentImageId = id;
      const imgData = images.find(i => i.id === id);
      
      // Вставляем SVG в контейнер
      svgContainer.innerHTML = imgData.svg;
      
      const svgElements = svgContainer.querySelectorAll('path, polygon, circle');
      
      // Присваиваем каждому элементу уникальный индекс и загружаем сохраненный цвет
      svgElements.forEach((el, index) => {
        el.dataset.index = index;
        
        // Если для этой картинки и этого элемента есть сохраненный цвет - применяем его
        if (savedProgress[id] && savedProgress[id][index]) {
          el.style.fill = savedProgress[id][index];
        }

        // Логика тапов и защиты от зума
        el.addEventListener('pointerdown', () => { isDragging = false; });
        el.addEventListener('pointermove', () => { isDragging = true; });
        
        el.addEventListener('pointerup', (e) => {
          if (!isDragging) {
            const target = e.target;
            target.style.fill = currentColor;
            saveColor(currentImageId, target.dataset.index, currentColor);
          }
        });
      });

      // Переключаем экраны
      galleryScreen.classList.remove('active');
      coloringScreen.classList.add('active');
    }

    // 3. Сохранение прогресса
    function saveColor(imageId, elementIndex, color) {
      if (!savedProgress[imageId]) {
        savedProgress[imageId] = {};
      }
      savedProgress[imageId][elementIndex] = color;
      
      // Записываем в память телефона
      localStorage.setItem('incolor_progress', JSON.stringify(savedProgress));
    }

    // 4. Управление интерфейсом
    document.getElementById('backBtn').addEventListener('click', () => {
      coloringScreen.classList.remove('active');
      galleryScreen.classList.add('active');
      svgContainer.innerHTML = ''; // Очищаем контейнер
      currentImageId = null;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if(confirm('Точно сбросить весь прогресс для этой картинки?')) {
        // Удаляем данные из объекта и памяти
        delete savedProgress[currentImageId];
        localStorage.setItem('incolor_progress', JSON.stringify(savedProgress));
        
        // Перекрашиваем все элементы обратно в базовый цвет
        svgContainer.querySelectorAll('path, polygon, circle').forEach(el => {
          el.style.fill = '#e4e4e7';
        });
      }
    });

    // 5. Выбор цвета в палитре
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        document.querySelector('.color-btn.active').classList.remove('active');
        e.target.classList.add('active');
        currentColor = e.target.dataset.color;
      });
    });
  </script>
</body>
</html>
